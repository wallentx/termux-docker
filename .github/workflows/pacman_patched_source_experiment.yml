              exit 0
            fi
            echo "::error::expected timeout for $REPRO_CANDIDATE, got status $status"
            exit 1
          fi

          if [ "$status" -eq 0 ]; then
            echo "::notice::observed expected success for $REPRO_CANDIDATE"
            exit 0
          fi

          echo "::error::expected success for $REPRO_CANDIDATE, got status $status"
          exit "$status"
          TERMUX_SCRIPT

          chmod +x "$script"
          /entrypoint.sh login -c \
            "CHILD_PATCH_MODE='$CHILD_PATCH_MODE' EXPECTED_RESULT='$EXPECTED_RESULT' PACMAN_VERSION='$PACMAN_VERSION' REPRO_CANDIDATE='$REPRO_CANDIDATE' REPRO_DIAG_AFTER_SECONDS='$REPRO_DIAG_AFTER_SECONDS' REPRO_IMAGE='$REPRO_IMAGE' REPRO_TIMEOUT_SECONDS='$REPRO_TIMEOUT_SECONDS' RUN_UNDER_STRACE='$RUN_UNDER_STRACE' bash '$script'"
