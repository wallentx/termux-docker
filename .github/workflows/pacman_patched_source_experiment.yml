name: Pacman patched source experiment

on:
  workflow_dispatch:
    inputs:
      image:
        description: Pacman-based Termux Docker image to test.
        required: true
        default: termux/termux-docker-pacman:aarch64
      pacman_version:
        description: Upstream pacman version to build.
        required: true
        default: "7.1.0"
      timeout_seconds:
        description: Seconds before the candidate test is treated as frozen.
        required: true
        default: "60"
      diagnostic_after_seconds:
        description: Seconds before dumping process state for a still-running test.
        required: true
        default: "25"

permissions:
  contents: read

jobs:
  source-candidate:
    name: source candidate / ${{ matrix.candidate }}
    runs-on: ubuntu-24.04-arm
    container:
      image: ${{ inputs.image }}
      options: --privileged
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - candidate: termux-patch-control
            child_patch_mode: control
            expected: timeout
            run_under_strace: "false"
          - candidate: trace-child-entry
            child_patch_mode: trace-child-entry
            expected: timeout
            run_under_strace: "true"
          - candidate: raw-clone-child-entry
            child_patch_mode: raw-clone-child-entry
            expected: timeout
            run_under_strace: "true"
    env:
      CHILD_PATCH_MODE: ${{ matrix.child_patch_mode }}
      EXPECTED_RESULT: ${{ matrix.expected }}
      PACMAN_VERSION: ${{ inputs.pacman_version }}
      REPRO_CANDIDATE: ${{ matrix.candidate }}
      REPRO_DIAG_AFTER_SECONDS: ${{ inputs.diagnostic_after_seconds }}
      REPRO_IMAGE: ${{ inputs.image }}
      REPRO_TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}
      RUN_UNDER_STRACE: ${{ matrix.run_under_strace }}
    steps:
      - name: Build patched pacman and test coreutils reinstall
        run: |
          set -eu

          termux_tmp=/data/data/com.termux/files/usr/tmp
          mkdir -p "$termux_tmp"
          script="$termux_tmp/pacman-source-experiment-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${REPRO_CANDIDATE}.sh"
          cat > "$script" <<'TERMUX_SCRIPT'
          #!/data/data/com.termux/files/usr/bin/bash
          set -euo pipefail
          export HOME="${TMPDIR:-$PREFIX/tmp}/pacman-source-home-${REPRO_CANDIDATE}"
          mkdir -p "$HOME"

          dump_processes() {
            echo "::group::process dump"
            ps -ef || true
            for pid in $(ps -ef | awk "/[p]acman/ { print \$2 }"); do
              echo "proc pid=$pid"
              printf "cmdline="
              tr "\000" " " < "/proc/$pid/cmdline" 2>/dev/null || true
              echo
              printf "wchan="
              cat "/proc/$pid/wchan" 2>/dev/null || true
              echo
              printf "syscall="
              cat "/proc/$pid/syscall" 2>/dev/null || true
              echo
              printf "children="
              cat "/proc/$pid/task/$pid/children" 2>/dev/null || true
              echo
              echo "stack:"
              cat "/proc/$pid/stack" 2>/dev/null || true
              echo "threads:"
              for task in "/proc/$pid/task"/*; do
                [ -d "$task" ] || continue
                tid="${task##*/}"
                printf "tid=%s wchan=" "$tid"
                cat "$task/wchan" 2>/dev/null || true
                printf " syscall="
                cat "$task/syscall" 2>/dev/null || true
                echo
              done
              sed -n "1,80p" "/proc/$pid/status" 2>/dev/null || true
              ls -l "/proc/$pid/fd" 2>/dev/null || true
            done
            command -v pacman || true
            command -v pacman-alternatives || true
            command -v update-alternatives || true
            ls -l "$PREFIX/share/libalpm/hooks" "$PREFIX/share/libalpm/scripts" "$PREFIX/share/pacman-alternatives" 2>/dev/null || true
            echo "::endgroup::"
          }

          disable_alternatives_hooks() {
            disabled_hooks_dir="${TMPDIR:-$PREFIX/tmp}/disabled-build-hooks-${REPRO_CANDIDATE}"
            mkdir -p "$disabled_hooks_dir"
            for hook in "$PREFIX"/share/libalpm/hooks/pacman-alternatives-*.hook; do
              [ -e "$hook" ] || continue
              mv "$hook" "$disabled_hooks_dir"/
            done
            echo "disabled_hooks_dir=$disabled_hooks_dir"
            ls -l "$disabled_hooks_dir" "$PREFIX/share/libalpm/hooks" 2>/dev/null || true
          }

          restore_alternatives_hooks() {
            disabled_hooks_dir="${TMPDIR:-$PREFIX/tmp}/disabled-build-hooks-${REPRO_CANDIDATE}"
            for hook in "$disabled_hooks_dir"/*.hook; do
              [ -e "$hook" ] || continue
              mv "$hook" "$PREFIX/share/libalpm/hooks"/
            done
            rmdir "$disabled_hooks_dir" 2>/dev/null || true
            ls -l "$PREFIX/share/libalpm/hooks" 2>/dev/null || true
          }

          install_build_deps() {
            timeout --kill-after=30s 600 pacman -Sy --noconfirm
            timeout --kill-after=30s 600 pacman -S --needed --noconfirm --noscriptlet \
              bash \
              clang \
              curl \
              gettext \
              gpgme \
              libandroid-glob \
              libarchive \
              libcurl \
              make \
              nettle \
              ninja \
              openssl \
              patch \
              python \
              python-pip \
              strace \
              tar
            timeout --kill-after=30s 600 pacman -S --needed --noconfirm --noscriptlet pkg-config || timeout --kill-after=30s 600 pacman -S --needed --noconfirm --noscriptlet pkgconf
            if ! command -v meson >/dev/null 2>&1; then
              python -m pip install --user meson || python -m pip install --user --break-system-packages meson
              export PATH="$HOME/.local/bin:$PATH"
            fi
          }

          build_pacman() {
            build_root="${TMPDIR:-$PREFIX/tmp}/pacman-source-${REPRO_CANDIDATE}"
            src_dir="$build_root/pacman-${PACMAN_VERSION}"
            build_dir="$src_dir/build"

            rm -rf "$build_root"
            mkdir -p "$build_root"

            curl -L --fail --silent --show-error \
              "https://gitlab.archlinux.org/pacman/pacman/-/releases/v${PACMAN_VERSION}/downloads/pacman-${PACMAN_VERSION}.tar.xz" \
              -o "$build_root/pacman.tar.xz"
            tar -C "$build_root" -xf "$build_root/pacman.tar.xz"

            termux_packages_ref=master
            patch_names="
              add.c.patch
              check.c.patch
              diskspace.c.patch
              doc-meson.build.patch
              executable_meson.build.patch
              makepkg.conf.in.patch
              makepkg.sh.in.patch
              pacman-key.sh.in.patch
              pacman.c.patch
              pacman.conf.in.patch
              repo-add.sh.in.patch
              trans.c.patch
              util.c.patch
            "
            for patch_name in $patch_names; do
              patch_file="$build_root/$patch_name"
              curl -L --fail --silent --show-error \
                "https://raw.githubusercontent.com/termux/termux-packages/${termux_packages_ref}/packages/pacman/${patch_name}" \
                -o "$patch_file"
              sed -i "s|@TERMUX_PREFIX@|$PREFIX|g" "$patch_file"
              patch -d "$src_dir" -p1 < "$patch_file"
            done

            termux_arch="$(uname -m)"
            case "$termux_arch" in
              armv7l|armv8l) termux_arch=arm ;;
              i*86) termux_arch=i686 ;;
            esac
            sed -i "s/@TERMUX_ARCH@/${termux_arch}/g" "$src_dir/etc/pacman.conf.in" "$src_dir/etc/makepkg.conf.in"
            rm -f "$src_dir/scripts/libmakepkg/executable/sudo.sh.in"
            rm -f "$src_dir/scripts/libmakepkg/executable/fakeroot.sh.in"

            case "$CHILD_PATCH_MODE" in
              control)
                ;;
              skip-handle-free)
                sed -i 's|^[[:space:]]*_alpm_handle_free(handle);|		/* skipped _alpm_handle_free(handle) before execv for Termux freeze experiment */|' \
                  "$src_dir/lib/libalpm/util.c"
                ;;
              skip-env)
                sed -i \
                  -e 's|^[[:space:]]*setenv("SHLVL", "1", 0);|		/* skipped setenv("SHLVL", "1", 0) before execv for Termux freeze experiment */|' \
                  -e 's|^[[:space:]]*unsetenv("BASH_ENV");|		/* skipped unsetenv("BASH_ENV") before execv for Termux freeze experiment */|' \
                  "$src_dir/lib/libalpm/util.c"
                ;;
              minimal-pre-exec)
                sed -i \
                  -e 's|^[[:space:]]*setenv("SHLVL", "1", 0);|		/* skipped setenv("SHLVL", "1", 0) before execv for Termux freeze experiment */|' \
                  -e 's|^[[:space:]]*unsetenv("BASH_ENV");|		/* skipped unsetenv("BASH_ENV") before execv for Termux freeze experiment */|' \
                  -e 's|^[[:space:]]*umask(0022);|		/* skipped umask(0022) before execv for Termux freeze experiment */|' \
                  -e 's|^[[:space:]]*_alpm_reset_signals();|		/* skipped _alpm_reset_signals() before execv for Termux freeze experiment */|' \
                  -e 's|^[[:space:]]*_alpm_handle_free(handle);|		/* skipped _alpm_handle_free(handle) before execv for Termux freeze experiment */|' \
                  "$src_dir/lib/libalpm/util.c"
                ;;
              raw-execve)
                sed -i '/#include <sys\/syscall.h>/a extern char **environ;' "$src_dir/lib/libalpm/util.c"
                sed -i 's|^[[:space:]]*execv(cmd, argv);|		syscall(SYS_execve, cmd, argv, environ);|' \
                  "$src_dir/lib/libalpm/util.c"
                ;;
              inline-raw-clone-execve)
                python - "$src_dir/lib/libalpm/util.c" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()
          if "extern char **environ;\n" not in text:
              if '#include "filelist.h"\n' in text:
                  text = text.replace('#include "filelist.h"\n', '#include "filelist.h"\n\nextern char **environ;\n', 1)
              else:
                  text = text.replace('#include "sandbox.h"\n', '#include "sandbox.h"\n\nextern char **environ;\n', 1)
          if "termux_raw_syscall6" not in text:
              helper = """
          #if !defined(__aarch64__)
          #error inline-raw-clone-execve currently supports aarch64 only
          #endif

          static long termux_raw_syscall6(long number, long arg0, long arg1, long arg2,
                  long arg3, long arg4, long arg5)
          {
              register long x0 __asm__("x0") = arg0;
              register long x1 __asm__("x1") = arg1;
              register long x2 __asm__("x2") = arg2;
              register long x3 __asm__("x3") = arg3;
              register long x4 __asm__("x4") = arg4;
              register long x5 __asm__("x5") = arg5;
              register long x8 __asm__("x8") = number;
              __asm__ volatile("svc #0"
                      : "+r"(x0)
                      : "r"(x1), "r"(x2), "r"(x3), "r"(x4), "r"(x5), "r"(x8)
                      : "memory");
              return x0;
          }
          """
              text = text.replace("extern char **environ;\n", "extern char **environ;\n" + helper, 1)

          start_marker = "\t/* fork- parent and child each have separate code blocks below */\n"
          parent_marker = "\t\t/* this code runs for the parent only (wait on the child) */\n"
          start = text.index(start_marker)
          parent = text.index(parent_marker, start)
          raw_block = """    /* Avoid bionic child-side fork/syscall wrappers before hook exec. */
              setenv("SHLVL", "1", 0);
              unsetenv("BASH_ENV");
              pid = termux_raw_syscall6(SYS_clone, SIGCHLD, 0, 0, 0, 0, 0);
              if(pid < 0) {
                  _alpm_log(handle, ALPM_LOG_ERROR, _("raw clone failed (%s)\\n"), strerror((int)-pid));
                  retval = 1;
                  goto cleanup;
              }

              if(pid == 0) {
                  const char child_entry[] = "PACMAN_CHILD inline_raw_child_entry\\n";
                  const char chdir_failed[] = "PACMAN_CHILD inline_raw_chdir_failed\\n";
                  const char exec_failed[] = "PACMAN_CHILD inline_raw_execve_failed\\n";

                  termux_raw_syscall6(SYS_write, child2parent_pipefd[HEAD], (long)child_entry, sizeof(child_entry) - 1, 0, 0, 0);
                  termux_raw_syscall6(SYS_dup3, child2parent_pipefd[HEAD], 1, 0, 0, 0, 0);
                  termux_raw_syscall6(SYS_dup3, child2parent_pipefd[HEAD], 2, 0, 0, 0, 0);
                  termux_raw_syscall6(SYS_dup3, parent2child_pipefd[TAIL], 0, 0, 0, 0, 0);
                  termux_raw_syscall6(SYS_close, parent2child_pipefd[TAIL], 0, 0, 0, 0, 0);
                  termux_raw_syscall6(SYS_close, parent2child_pipefd[HEAD], 0, 0, 0, 0, 0);
                  termux_raw_syscall6(SYS_close, child2parent_pipefd[TAIL], 0, 0, 0, 0, 0);
                  termux_raw_syscall6(SYS_close, child2parent_pipefd[HEAD], 0, 0, 0, 0, 0);
                  if(cwdfd >= 0) {
                      termux_raw_syscall6(SYS_close, cwdfd, 0, 0, 0, 0, 0);
                  }
                  if(termux_raw_syscall6(SYS_chdir, (long)"/", 0, 0, 0, 0, 0) < 0) {
                      termux_raw_syscall6(SYS_write, 2, (long)chdir_failed, sizeof(chdir_failed) - 1, 0, 0, 0);
                      termux_raw_syscall6(SYS_exit, 126, 0, 0, 0, 0, 0);
                      __builtin_unreachable();
                  }
                  termux_raw_syscall6(SYS_umask, 0022, 0, 0, 0, 0, 0);
                  termux_raw_syscall6(SYS_execve, (long)cmd, (long)argv, (long)environ, 0, 0, 0);
                  termux_raw_syscall6(SYS_write, 2, (long)exec_failed, sizeof(exec_failed) - 1, 0, 0, 0);
                  termux_raw_syscall6(SYS_exit, 127, 0, 0, 0, 0, 0);
                  __builtin_unreachable();
              } else {
          """
          text = text[:start] + raw_block + text[parent:]
          path.write_text(text)
          PY
                ;;
              posix-spawn-hooks)
                python - "$src_dir/lib/libalpm/util.c" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()
          text = text.replace("#include <poll.h>\n", "#include <poll.h>\n#include <spawn.h>\n", 1)
          if "extern char **environ;\n" not in text:
              if '#include "filelist.h"\n' in text:
                  text = text.replace('#include "filelist.h"\n', '#include "filelist.h"\n\nextern char **environ;\n', 1)
              else:
                  text = text.replace('#include "sandbox.h"\n', '#include "sandbox.h"\n\nextern char **environ;\n', 1)

          start_marker = "\t/* fork- parent and child each have separate code blocks below */\n"
          parent_marker = "\t\t/* this code runs for the parent only (wait on the child) */\n"
          start = text.index(start_marker)
          parent = text.index(parent_marker, start)
          spawn_block = """    /* Avoid bionic fork child handlers in pacman hook execution on Termux. */
              {
                  posix_spawn_file_actions_t actions;
                  int spawn_ret = posix_spawn_file_actions_init(&actions);
                  mode_t oldmask;

                  if(spawn_ret != 0) {
                      _alpm_log(handle, ALPM_LOG_ERROR, _("could not initialize spawn actions (%s)\\n"), strerror(spawn_ret));
                      retval = 1;
                      goto cleanup;
                  }

          #define CHECK_SPAWN_ACTION(expr) do { \\
                  spawn_ret = (expr); \\
                  if(spawn_ret != 0) { \\
                      posix_spawn_file_actions_destroy(&actions); \\
                      _alpm_log(handle, ALPM_LOG_ERROR, _("could not set spawn file action (%s)\\n"), strerror(spawn_ret)); \\
                      retval = 1; \\
                      goto cleanup; \\
                  } \\
              } while(0)

                  CHECK_SPAWN_ACTION(posix_spawn_file_actions_adddup2(&actions, child2parent_pipefd[HEAD], 1));
                  CHECK_SPAWN_ACTION(posix_spawn_file_actions_adddup2(&actions, child2parent_pipefd[HEAD], 2));
                  CHECK_SPAWN_ACTION(posix_spawn_file_actions_adddup2(&actions, parent2child_pipefd[TAIL], 0));
                  CHECK_SPAWN_ACTION(posix_spawn_file_actions_addclose(&actions, parent2child_pipefd[TAIL]));
                  CHECK_SPAWN_ACTION(posix_spawn_file_actions_addclose(&actions, parent2child_pipefd[HEAD]));
                  CHECK_SPAWN_ACTION(posix_spawn_file_actions_addclose(&actions, child2parent_pipefd[TAIL]));
                  CHECK_SPAWN_ACTION(posix_spawn_file_actions_addclose(&actions, child2parent_pipefd[HEAD]));
                  if(cwdfd >= 0) {
                      CHECK_SPAWN_ACTION(posix_spawn_file_actions_addclose(&actions, cwdfd));
                  }

          #undef CHECK_SPAWN_ACTION

                  setenv("SHLVL", "1", 0);
                  unsetenv("BASH_ENV");
                  oldmask = umask(0022);
                  spawn_ret = posix_spawn(&pid, cmd, &actions, NULL, argv, environ);
                  umask(oldmask);
                  posix_spawn_file_actions_destroy(&actions);
                  if(spawn_ret != 0) {
                      _alpm_log(handle, ALPM_LOG_ERROR, _("call to posix_spawn failed (%s)\\n"), strerror(spawn_ret));
                      retval = 1;
                      goto cleanup;
                  }
              }

              {
          """
          text = text[:start] + spawn_block + text[parent:]
          path.write_text(text)
          PY
                ;;
              posix-spawn-attrs)
                python - "$src_dir/lib/libalpm/util.c" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()
          text = text.replace("#include <poll.h>\n", "#include <poll.h>\n#include <spawn.h>\n", 1)
          if "extern char **environ;\n" not in text:
              if '#include "filelist.h"\n' in text:
                  text = text.replace('#include "filelist.h"\n', '#include "filelist.h"\n\nextern char **environ;\n', 1)
              else:
                  text = text.replace('#include "sandbox.h"\n', '#include "sandbox.h"\n\nextern char **environ;\n', 1)

          start_marker = "\t/* fork- parent and child each have separate code blocks below */\n"
          parent_marker = "\t\t/* this code runs for the parent only (wait on the child) */\n"
          start = text.index(start_marker)
          parent = text.index(parent_marker, start)
          spawn_block = """    /* Test posix_spawn with signal attrs matching pacman's child reset. */
              {
                  posix_spawn_file_actions_t actions;
                  posix_spawnattr_t attr;
                  sigset_t empty_mask, def_set;
                  int spawn_ret = posix_spawn_file_actions_init(&actions);
                  mode_t oldmask;

                  if(spawn_ret != 0) {
                      _alpm_log(handle, ALPM_LOG_ERROR, _("could not initialize spawn actions (%s)\\n"), strerror(spawn_ret));
                      retval = 1;
                      goto cleanup;
                  }

                  spawn_ret = posix_spawnattr_init(&attr);
                  if(spawn_ret != 0) {
                      posix_spawn_file_actions_destroy(&actions);
                      _alpm_log(handle, ALPM_LOG_ERROR, _("could not initialize spawn attributes (%s)\\n"), strerror(spawn_ret));
                      retval = 1;
                      goto cleanup;
                  }

          #define CHECK_SPAWN_ACTION(expr) do { \\
                  spawn_ret = (expr); \\
                  if(spawn_ret != 0) { \\
                      posix_spawnattr_destroy(&attr); \\
                      posix_spawn_file_actions_destroy(&actions); \\
                      _alpm_log(handle, ALPM_LOG_ERROR, _("could not set spawn file action (%s)\\n"), strerror(spawn_ret)); \\
                      retval = 1; \\
                      goto cleanup; \\
                  } \\
              } while(0)

                  CHECK_SPAWN_ACTION(posix_spawn_file_actions_adddup2(&actions, child2parent_pipefd[HEAD], 1));
                  CHECK_SPAWN_ACTION(posix_spawn_file_actions_adddup2(&actions, child2parent_pipefd[HEAD], 2));
                  CHECK_SPAWN_ACTION(posix_spawn_file_actions_adddup2(&actions, parent2child_pipefd[TAIL], 0));
                  CHECK_SPAWN_ACTION(posix_spawn_file_actions_addclose(&actions, parent2child_pipefd[TAIL]));
                  CHECK_SPAWN_ACTION(posix_spawn_file_actions_addclose(&actions, parent2child_pipefd[HEAD]));
                  CHECK_SPAWN_ACTION(posix_spawn_file_actions_addclose(&actions, child2parent_pipefd[TAIL]));
                  CHECK_SPAWN_ACTION(posix_spawn_file_actions_addclose(&actions, child2parent_pipefd[HEAD]));
                  if(cwdfd >= 0) {
                      CHECK_SPAWN_ACTION(posix_spawn_file_actions_addclose(&actions, cwdfd));
                  }

          #undef CHECK_SPAWN_ACTION

                  sigemptyset(&empty_mask);
                  sigemptyset(&def_set);
                  sigaddset(&def_set, SIGABRT);
                  sigaddset(&def_set, SIGALRM);
                  sigaddset(&def_set, SIGBUS);
                  sigaddset(&def_set, SIGCHLD);
                  sigaddset(&def_set, SIGCONT);
                  sigaddset(&def_set, SIGFPE);
                  sigaddset(&def_set, SIGHUP);
                  sigaddset(&def_set, SIGILL);
                  sigaddset(&def_set, SIGINT);
                  sigaddset(&def_set, SIGPIPE);
                  sigaddset(&def_set, SIGQUIT);
                  sigaddset(&def_set, SIGSEGV);
                  sigaddset(&def_set, SIGTERM);
                  sigaddset(&def_set, SIGTSTP);
                  sigaddset(&def_set, SIGTTIN);
                  sigaddset(&def_set, SIGTTOU);
                  sigaddset(&def_set, SIGUSR1);
                  sigaddset(&def_set, SIGUSR2);
                  sigaddset(&def_set, SIGPROF);
                  sigaddset(&def_set, SIGSYS);
                  sigaddset(&def_set, SIGTRAP);
                  sigaddset(&def_set, SIGURG);
                  sigaddset(&def_set, SIGVTALRM);
                  sigaddset(&def_set, SIGXCPU);
                  sigaddset(&def_set, SIGXFSZ);
          #if defined(SIGPOLL)
                  sigaddset(&def_set, SIGPOLL);
          #endif

                  spawn_ret = posix_spawnattr_setsigmask(&attr, &empty_mask);
                  if(spawn_ret == 0) {
                      spawn_ret = posix_spawnattr_setsigdefault(&attr, &def_set);
                  }
                  if(spawn_ret == 0) {
                      spawn_ret = posix_spawnattr_setflags(&attr, POSIX_SPAWN_SETSIGMASK | POSIX_SPAWN_SETSIGDEF);
                  }
                  if(spawn_ret != 0) {
                      posix_spawnattr_destroy(&attr);
                      posix_spawn_file_actions_destroy(&actions);
                      _alpm_log(handle, ALPM_LOG_ERROR, _("could not set spawn attributes (%s)\\n"), strerror(spawn_ret));
                      retval = 1;
                      goto cleanup;
                  }

                  setenv("SHLVL", "1", 0);
                  unsetenv("BASH_ENV");
                  oldmask = umask(0022);
                  spawn_ret = posix_spawn(&pid, cmd, &actions, &attr, argv, environ);
                  umask(oldmask);
                  posix_spawnattr_destroy(&attr);
                  posix_spawn_file_actions_destroy(&actions);
                  if(spawn_ret != 0) {
                      _alpm_log(handle, ALPM_LOG_ERROR, _("call to posix_spawn failed (%s)\\n"), strerror(spawn_ret));
                      retval = 1;
                      goto cleanup;
                  }
              }

              {
          """
          text = text[:start] + spawn_block + text[parent:]
          path.write_text(text)
          PY
                ;;
              fork-preinit-only)
                # ONLY patch pacman.c — pre-init termux-exec dlsym pointers.
                # Do NOT touch util.c — keep original fork()+execv() code path.
                # termux-exec only wraps: execve, execv, execvp, execlp,
                # execl, execle, execvpe (NOT execveat/posix_spawn/posix_spawnp).
                python - "$src_dir/src/pacman/pacman.c" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()

          # Add dlfcn.h for dlsym
          text = text.replace('#include <stdlib.h>', '#include <stdlib.h>\n#include <dlfcn.h>', 1)

          # Pre-init function: call each exec wrapper with empty args to force
          # termux-exec's lazy dlsym(RTLD_NEXT, ...) to resolve NOW, in the
          # safe single-threaded parent context.
          helper = """
          static void preinit_termux_exec(void) {
              /* Force termux-exec (LD_PRELOAD) to resolve its internal
               * dlsym(RTLD_NEXT, ...) pointers NOW, while single-threaded.
               * Without this, the child side of fork() triggers a lazy
               * dlsym inside the wrapper, which deadlocks on Bionic's
               * g_dl_mutex (held by parent at fork time). */
              char *const empty_argv[] = { NULL };
              char *const empty_envp[] = { NULL };

              /* These are the only functions termux-exec actually wraps.
               * Calling with empty path returns ENOENT but forces the
