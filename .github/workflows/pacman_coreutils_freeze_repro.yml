name: Pacman coreutils freeze repro

on:
  workflow_dispatch:
    inputs:
      image:
        description: Pacman-based Termux Docker image to test.
        required: true
        default: termux/termux-docker-pacman:aarch64
      timeout_seconds:
        description: Seconds before a case is treated as frozen.
        required: true
        default: "300"
      diagnostic_after_seconds:
        description: Seconds before dumping process state for a still-running case.
        required: true
        default: "240"

permissions:
  contents: read

jobs:
  actions-container:
    name: actions container / ${{ matrix.case }}
    runs-on: ubuntu-24.04-arm
    container:
      image: ${{ inputs.image }}
      options: --privileged
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: baseline-no-upgrade
            prep: ""
            command: pacman -S coreutils --noconfirm --overwrite=*
          - case: baseline-after-upgrade
            prep: pacman -Syu --noconfirm
            command: pacman -S coreutils --noconfirm --overwrite=*
          - case: noscriptlet-after-upgrade
            prep: pacman -Syu --noconfirm
            command: pacman -S coreutils --noconfirm --overwrite=* --noscriptlet
          - case: empty-hookdir
            prep: ""
            command: mkdir -p "$TMPDIR/no-alpm-hooks"; pacman -S coreutils --noconfirm --overwrite=* --noscriptlet --hookdir "$TMPDIR/no-alpm-hooks"
          - case: alternatives-hooks-disabled
            prep: ""
            command: mkdir -p "$TMPDIR/disabled-alpm-hooks"; mv "$PREFIX"/share/libalpm/hooks/pacman-alternatives-*.hook "$TMPDIR/disabled-alpm-hooks"/; pacman -S coreutils --noconfirm --overwrite=*
          - case: strace-baseline
            prep: command -v strace >/dev/null 2>&1 || pacman -S strace --noconfirm
            command: strace -ff -tt -s 200 -o "$TMPDIR/pacman-coreutils.trace" pacman -S coreutils --noconfirm --overwrite=*
          - case: manual-alternatives
            prep: ""
            command: PA_VERBOSE=true pacman-alternatives -Ea cat --overwrite
          - case: hook-stdin
            prep: ""
            command: printf '%s\n' '/data/data/com.termux/files/usr/share/pacman-alternatives/cat.alt' | PA_VERBOSE=true /data/data/com.termux/files/usr/share/libalpm/scripts/run-pacman-alternatives enable
    env:
      REPRO_CASE: ${{ matrix.case }}
      REPRO_COMMAND: ${{ matrix.command }}
      REPRO_DIAG_AFTER_SECONDS: ${{ inputs.diagnostic_after_seconds }}
      REPRO_IMAGE: ${{ inputs.image }}
      REPRO_PREP: ${{ matrix.prep }}
      REPRO_TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}
    steps:
      - name: Run repro case inside Actions container
        run: |
          set -eu

          dump_processes() {
            # shellcheck disable=SC2016
            termux_diag='
            ps -ef || true
            for pid in $(ps -ef | awk "/[p]acman/ { print \$2 }"); do
              echo "proc pid=$pid"
              printf "cmdline="
              tr "\000" " " < "/proc/$pid/cmdline" 2>/dev/null || true
              echo
              printf "wchan="
              cat "/proc/$pid/wchan" 2>/dev/null || true
              echo
              sed -n "1,80p" "/proc/$pid/status" 2>/dev/null || true
              ls -l "/proc/$pid/fd" 2>/dev/null || true
            done
            for trace in "$TMPDIR"/pacman-coreutils.trace*; do
              if [ -f "$trace" ]; then
                echo "trace tail: $trace"
                tail -n 80 "$trace" || true
              fi
            done
            command -v pacman-alternatives || true
            command -v update-alternatives || true
            ls -l "$PREFIX/share/libalpm/hooks" "$PREFIX/share/libalpm/scripts" "$PREFIX/share/pacman-alternatives" 2>/dev/null || true
            '
            echo "::group::process dump"
            ps -ef || true
            timeout 30 /entrypoint.sh login -c "$termux_diag" || true
            echo "::endgroup::"
          }

          run_termux() {
            label=$1
            command=$2
            diag_after=$REPRO_DIAG_AFTER_SECONDS

            if [ -z "$command" ]; then
              return 0
            fi
            if [ "$diag_after" -ge "$REPRO_TIMEOUT_SECONDS" ]; then
              diag_after=$((REPRO_TIMEOUT_SECONDS / 2))
            fi

            echo "::group::$label"
            /entrypoint.sh login -c "set -eux; $command" &
            command_pid=$!
            (
              sleep "$diag_after"
              if kill -0 "$command_pid" 2>/dev/null; then
                echo "::warning::$label still running after ${diag_after}s"
                dump_processes
              fi
            ) &
            diag_pid=$!

            set +e
            timeout "$REPRO_TIMEOUT_SECONDS" sh -c "while kill -0 $command_pid 2>/dev/null; do sleep 1; done"
            monitor_status=$?
            if [ "$monitor_status" -eq 124 ]; then
              status=124
              kill "$command_pid" 2>/dev/null || true
              sleep 2
              kill -9 "$command_pid" 2>/dev/null || true
            else
              wait "$command_pid"
              status=$?
            fi
            kill "$diag_pid" 2>/dev/null || true
            wait "$diag_pid" 2>/dev/null || true
            set -e
            echo "status=$status"
            if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
              echo "::error::$label timed out after ${REPRO_TIMEOUT_SECONDS}s"
              dump_processes
            elif [ "$status" -ne 0 ]; then
              echo "::error::$label failed with status $status"
              dump_processes
            fi
            echo "::endgroup::"
            return "$status"
          }

          echo "image=$REPRO_IMAGE"
          echo "case=$REPRO_CASE"
          run_termux "prep" "$REPRO_PREP"
          run_termux "case" "$REPRO_COMMAND"

  docker-run:
    name: docker run / ${{ matrix.case }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: baseline-after-upgrade
            prep: pacman -Syu --noconfirm
            command: pacman -S coreutils --noconfirm --overwrite=*
          - case: noscriptlet-after-upgrade
            prep: pacman -Syu --noconfirm
            command: pacman -S coreutils --noconfirm --overwrite=* --noscriptlet
          - case: empty-hookdir
            prep: ""
            command: mkdir -p "$TMPDIR/no-alpm-hooks"; pacman -S coreutils --noconfirm --overwrite=* --noscriptlet --hookdir "$TMPDIR/no-alpm-hooks"
          - case: alternatives-hooks-disabled
            prep: ""
            command: mkdir -p "$TMPDIR/disabled-alpm-hooks"; mv "$PREFIX"/share/libalpm/hooks/pacman-alternatives-*.hook "$TMPDIR/disabled-alpm-hooks"/; pacman -S coreutils --noconfirm --overwrite=*
          - case: strace-baseline
            prep: command -v strace >/dev/null 2>&1 || pacman -S strace --noconfirm
            command: strace -ff -tt -s 200 -o "$TMPDIR/pacman-coreutils.trace" pacman -S coreutils --noconfirm --overwrite=*
          - case: manual-alternatives
            prep: ""
            command: PA_VERBOSE=true pacman-alternatives -Ea cat --overwrite
          - case: hook-stdin
            prep: ""
            command: printf '%s\n' '/data/data/com.termux/files/usr/share/pacman-alternatives/cat.alt' | PA_VERBOSE=true /data/data/com.termux/files/usr/share/libalpm/scripts/run-pacman-alternatives enable
    env:
      REPRO_CASE: ${{ matrix.case }}
      REPRO_COMMAND: ${{ matrix.command }}
      REPRO_DIAG_AFTER_SECONDS: ${{ inputs.diagnostic_after_seconds }}
      REPRO_IMAGE: ${{ inputs.image }}
      REPRO_PREP: ${{ matrix.prep }}
      REPRO_TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}
    steps:
      - name: Run repro case with docker run
        run: |
          set -eu

          container_name="pacman-coreutils-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${REPRO_CASE}"
          script='set -eux'
          if [ -n "$REPRO_PREP" ]; then
            script="$script
          $REPRO_PREP"
          fi
          script="$script
          $REPRO_COMMAND"

          dump_container() {
            # shellcheck disable=SC2016
            termux_diag='
            ps -ef || true
            for pid in $(ps -ef | awk "/[p]acman/ { print \$2 }"); do
              echo "proc pid=$pid"
              printf "cmdline="
              tr "\000" " " < "/proc/$pid/cmdline" 2>/dev/null || true
              echo
              printf "wchan="
              cat "/proc/$pid/wchan" 2>/dev/null || true
              echo
              sed -n "1,80p" "/proc/$pid/status" 2>/dev/null || true
              ls -l "/proc/$pid/fd" 2>/dev/null || true
            done
            for trace in "$TMPDIR"/pacman-coreutils.trace*; do
              if [ -f "$trace" ]; then
                echo "trace tail: $trace"
                tail -n 80 "$trace" || true
              fi
            done
            command -v pacman-alternatives || true
            command -v update-alternatives || true
            ls -l "$PREFIX/share/libalpm/hooks" "$PREFIX/share/libalpm/scripts" "$PREFIX/share/pacman-alternatives" 2>/dev/null || true
            '
            echo "::group::docker container dump"
            docker ps -a || true
            docker top "$container_name" || true
            docker logs "$container_name" || true
            timeout --kill-after=10s 30 docker exec "$container_name" /entrypoint.sh login -c "$termux_diag" || true
            echo "::endgroup::"
          }

          trap 'docker rm -f "$container_name" >/dev/null 2>&1 || true' EXIT

          echo "image=$REPRO_IMAGE"
          echo "case=$REPRO_CASE"
          set +e
          timeout --kill-after=30s "$REPRO_TIMEOUT_SECONDS" docker run \
            --name "$container_name" \
            --privileged \
            "$REPRO_IMAGE" \
            login -c "$script" &
          run_pid=$!
          (
            sleep "$REPRO_DIAG_AFTER_SECONDS"
            if kill -0 "$run_pid" 2>/dev/null; then
              echo "::warning::docker run still running after ${REPRO_DIAG_AFTER_SECONDS}s"
              dump_container
            fi
          ) &
          diag_pid=$!
          wait "$run_pid"
          status=$?
          kill "$diag_pid" 2>/dev/null || true
          wait "$diag_pid" 2>/dev/null || true
          set -e
          echo "status=$status"
          if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
            echo "::error::docker run timed out after ${REPRO_TIMEOUT_SECONDS}s"
            dump_container
          elif [ "$status" -ne 0 ]; then
            echo "::error::docker run failed with status $status"
            dump_container
          fi
          exit "$status"
